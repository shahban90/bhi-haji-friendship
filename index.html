<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Best Friend Day - BHI HAJI</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #1a0033, #0b001a, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Moving Neon Background Glows */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 0, 128, 0.3);
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            animation: moveGlow 6s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .glow:nth-child(2) {
            background: rgba(0, 242, 254, 0.3);
            bottom: 5%;
            right: 5%;
            animation-delay: 3s;
        }

        @keyframes moveGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.3); }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: all 0.5s ease;
        }

        /* Main Card Design */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 35px 20px;
            border-radius: 25px;
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: cardEntrance 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Name Heading - BHI HAJI */
        .haji-title {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc, #ff00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientAnim 4s ease infinite, textBounce 1.5s infinite alternate;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes textBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .sub-heading {
            font-size: 1.4rem;
            color: #00f2fe;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* Shayari Box */
        .message-box {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid #ff007f;
            border-right: 4px solid #00f2fe;
            padding: 25px 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .poetry-line {
            color: #f1f1f1;
            font-size: 1.15rem;
            line-height: 1.8;
            margin: 12px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .line-1 { animation-delay: 0.5s; }
        .line-2 { animation-delay: 1.8s; color: #ffcc00; font-weight: bold; }
        .line-3 { animation-delay: 3.1s; }
        .line-4 { animation-delay: 4.4s; color: #00f2fe; font-weight: bold; font-size: 1.25rem; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 1s forwards 5.5s;
        }

        .btn {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            border-radius: 50px;
            box-shadow: 0 5px 25px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 10px 35px rgba(255, 0, 127, 0.9);
        }

        .space-btn {
            background: linear-gradient(135deg, #00f2fe, #7f00ff);
            box-shadow: 0 5px 25px rgba(0, 242, 254, 0.6);
        }

        /* SPACE GALLERY OVERLAY */
        #spaceGallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0b001a, #000000);
            z-index: 999;
            display: none;
            overflow: hidden;
            cursor: grab;
        }

        #spaceGallery:active {
            cursor: grabbing;
        }

        /* Starry background effect inside space */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Floating Photos in Space */
        .floating-photo {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 20px;
            border: 3px solid #ff007f;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7), 0 0 50px rgba(0, 242, 254, 0.5);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            user-select: none;
            animation: floatSpace 8s infinite alternate ease-in-out;
        }

        .floating-photo:hover {
            transform: scale(1.25);
            z-index: 10000;
            box-shadow: 0 0 40px #ffcc00, 0 0 80px #ff007f;
        }

        @keyframes floatSpace {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, -40px) rotate(5deg); }
            100% { transform: translate(-30px, 30px) rotate(-5deg); }
        }

        /* Back to Card Button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            background: rgba(255, 0, 127, 0.8);
            color: white;
            border: 2px solid #fff;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #ff007f;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #ff007f;
            transform: translateX(-50%) scale(1.05);
        }

        @media (max-width: 480px) {
            .haji-title { font-size: 2.3rem; }
            .sub-heading { font-size: 1.1rem; }
            .poetry-line { font-size: 1rem; }
            .floating-photo { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="glow"></div>

    <!-- Background Audio -->
    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainContainer">
        <div class="card">
            <!-- Glowing Name -->
            <div class="haji-title">BHI HAJI</div>
            <div class="sub-heading">🔥 Happy Best Friend Day! 🔥</div>

            <!-- Poetry with Emojis -->
            <div class="message-box">
                <div class="poetry-line line-1">👑 Teri dosti ke chahat py naaz hai mojy... ✨</div>
                <div class="poetry-line line-2">🤝 Teri har aik baat py aetbar hai mojy... 💯</div>
                <div class="poetry-line line-3">😊 Rahy teri har muskurahat hamesha chery par... 🌹</div>
                <div class="poetry-line line-4">💖 Q k teri muskurahat se pyaar hai mojy! 😍</div>
            </div>
            
            <!-- Action Buttons -->
            <div class="btn-group">
                <button class="btn" onclick="triggerDhamaka()">🎆 Dhamaka!</button>
                <button class="btn space-btn" onclick="openSpaceGallery()">🚀 Space Gallery</button>
                <button class="btn" id="musicBtn" onclick="toggleMusic()">🎵 Music</button>
            </div>
        </div>
    </div>

    <!-- SPACE GALLERY VIEW (Yahan apni photos ke naam change karein) -->
    <div id="spaceGallery">
        <button class="bakh-btn back-btn" onclick="closeSpaceGallery()">❌ Wapas Jao</button>
        
        <!-- Apni pehli photo ka naam yahan likhein -->
        <img src="FB_IMG_1772849695010.jpg" class="floating-photo" style="top: 20%; left: 15%; animation-duration: 7s;" alt="Photo 1">
        
        <!-- Apni dusri photo ka naam yahan likhein -->
        <img src="Screenshot_20260214_175929.jpg" class="floating-photo" style="top: 60%; left: 75%; animation-duration: 9s;" alt="Photo 2">
        
        <!-- Apni teesri photo ka naam yahan likhein -->
        <img src="Screenshot_20260214_180007.jpg"floating-photo" style="top: 40%; left: 45%; animation-duration: 6s;" alt="Photo 3">
        
        <!-- Apni chothi photo ka naam yahan likhein -->
        <img src="Screenshot_20260214_180027.jpg" class="floating-photo" style="top: 75%; left: 20%; animation-duration: 10s;" alt="Photo 4">
        
        <!-- Apni panchvi photo ka naam yahan likhein -->
        <img src="Snapchat-1757712763.jpg" class="floating-photo" style="top: 15%; left: 70%; animation-duration: 8s;" alt="Photo 5">
    </div>

    <script>
        window.onload = function() {
            triggerDhamaka();
            setTimeout(triggerDhamaka, 1200);
            createStars();
        };

        function triggerDhamaka() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        // Music Control
        let music = document.getElementById("bgMusic");
        let musicBtn = document.getElementById("musicBtn");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = "🎵 Music";
                isPlaying = false;
            } else {
                music.play().then(() => {
                    musicBtn.innerText = "🔇 Stop";
                    isPlaying = true;
                }).catch(e => {
                    alert("Browser policy ki wajah se music click par play hua. Enjoy!");
                });
            }
        }

        // Space Gallery Functions
        function openSpaceGallery() {
            document.getElementById('spaceGallery').style.display = 'block';
        }

        function closeSpaceGallery() {
            document.getElementById('spaceGallery').style.display = 'none';
        }

        // Create background stars in Space
        function createStars() {
            const space = document.getElementById('spaceGallery');
            for (let i = 0; i < 100; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.animationDuration = (Math.random() * 3 + 1) + 's';
                space.appendChild(star);
            }
        }

        // Dragging & Floating interaction for Photos in Space
        const photos = document.querySelectorAll('.floating-photo');
        photos.forEach(photo => {
            let isDragging = false;
            let startX, startY, initialX = 0, initialY = 0;

            photo.addListener = photo.addEventListener;
            photo.addEventListener('mousedown', dragStart);
            photo.addEventListener('touchstart', dragStart, {passive: true});

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: true});

            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                isDragging = true;
                photo.style.animation = 'none'; 
                let clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                startX = clientX - initialX;
                startY = clientY - initialY;
            }

            function drag(e) {
                if (!isDragging) return;
                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                initialX = clientX - startX;
                initialY = clientY - startY;
                photo.style.transform = `translate(${initialX}px, ${initialY}px) scale(1.15)`;
            }

            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                photo.style.animation = 'floatSpace 8s infinite alternate ease-in-out';
            }
        });
    </script>
</body>
</html>
